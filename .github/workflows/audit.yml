name: Audit
on:
  push:
    paths:
      - "Formula/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/**"
  workflow_dispatch:
jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Homebrew
        run: brew update
      - name: Tap own repository from local checkout
        # runner 默认不 tap 自己，得手动 tap（用 checkout 出来的本地路径，
        # 避免 brew tap 默认从 GitHub 再 clone 一遍）
        # 同时把 formula 文件改成 644（brew audit --strict 要求 a+r）
        run: |
          chmod -R a+r "$GITHUB_WORKSPACE/Formula"
          brew tap szmickhuang/tap "$GITHUB_WORKSPACE"
      - name: Run brew audit
        # brew 5.x+ 禁用 `brew audit [path ...]`，必须用 `[name ...]`
        # name 形式是 `user/tap/formula`
        run: brew audit --strict --online szmickhuang/tap/crush
      - name: Run brew style
        run: brew style szmickhuang/tap/crush
